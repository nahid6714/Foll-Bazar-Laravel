name: Test cPanel FTP Port

on:
  workflow_dispatch:

jobs:
  ftp-port-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test FTP port 21
        run: |
          timeout 15 bash -c '</dev/tcp/78.46.25.219/21' \
            && echo "FTP_PORT_21_REACHABLE" \
            || (echo "FTP_PORT_21_NOT_REACHABLE"; exit 1)
