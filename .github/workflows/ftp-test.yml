name: Test cPanel FTPS

on:
  workflow_dispatch:

jobs:
  ftp-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force IPv4 for FTP hostname
        run: |
          echo "104.21.78.77 ftp.lakebazar.com" | sudo tee -a /etc/hosts
          getent hosts ftp.lakebazar.com

      - name: Test FTPS connection
        uses: step-security/ftp-deploy-action@v4
        with:
          server: ftp.lakebazar.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          dry-run: true
          local-dir: ./public/
          server-dir: ./
